<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="אימונים">
  <title>אימונים</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">אימון</h1>
  </header>

  <main id="view"></main>

  <div id="timer" class="timer hidden" aria-live="polite">
    <button data-act="timer-sub" aria-label="פחות 15 שניות">‎-15</button>
    <div class="timer-mid">
      <div class="timer-label">מנוחה</div>
      <div id="timer-time" class="timer-time">0:00</div>
      <div class="timer-bar"><div id="timer-fill"></div></div>
    </div>
    <button data-act="timer-add" aria-label="עוד 15 שניות">‎+15</button>
    <button data-act="timer-stop" class="timer-x" aria-label="עצור טיימר">✕</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <nav class="tabs">
    <button data-tab="workout"><span class="ico">🏋️</span>אימון</button>
    <button data-tab="templates"><span class="ico">📋</span>תבניות</button>
    <button data-tab="history"><span class="ico">🗓️</span>היסטוריה</button>
    <button data-tab="progress"><span class="ico">📈</span>התקדמות</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
