<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E9EDEF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F141C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BTMN">
  <title>BTMN</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=3">
  <link rel="icon" href="icons/logo.svg?v=3" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png?v=3">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-act="bateman" aria-label="Bateman"><img src="icons/logo.svg?v=3" alt="" width="40" height="40"></button>
    <h1 id="title">אימון</h1>
    <span class="top-elapsed hidden" id="top-elapsed" aria-hidden="true"></span>
    <button class="gear" data-tab="settings" aria-label="הגדרות וגיבוי"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>

  <main id="view"></main>

  <div id="timer" class="timer hidden" aria-live="polite">
    <button data-act="timer-add" aria-label="עוד 15 שניות">‎+15</button>
    <div class="timer-mid">
      <div class="timer-label" id="timer-label">מנוחה</div>
      <div id="timer-time" class="timer-time">0:00</div>
      <div class="timer-bar"><div id="timer-fill"></div></div>
    </div>
    <button data-act="timer-sub" aria-label="פחות 15 שניות">‎-15</button>
    <button data-act="timer-stop" class="timer-x" aria-label="עצור טיימר">✕</button>
  </div>

  <div id="sheet" class="sheet hidden" data-act="demo-close"></div>

  <div id="bateman" class="bateman hidden" data-act="bateman-close" role="dialog" aria-modal="true" aria-label="Bateman Arc">
    <canvas id="boom" aria-hidden="true"></canvas>
    <div class="bateman-card">
      <img src="icons/bateman.jpg?v=2" alt="Bateman" width="720" height="720">
      <h2 dir="ltr">BATEMAN ARC</h2>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <nav class="tabs">
    <button data-tab="workout"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>אימון</span></button>
    <button data-tab="history"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg><span>היסטוריה</span></button>
    <button data-tab="progress"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4.5-4.5 3.5 3L19 7"/><path d="M15 7h4v4"/></svg><span>התקדמות</span></button>
    <button data-tab="body"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 9.5l1.5-2"/></svg><span>מדדי גוף</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
